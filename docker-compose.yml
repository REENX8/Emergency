services:
  backend:
    build: ./backend
    container_name: evacuation-backend
    restart: unless-stopped
    environment:
      # SQLite lives on the data volume so it survives restarts; override
      # DATABASE_URL with a Supabase / Postgres URL for production-like
      # behaviour. The CRA dev server isn't talking to this container.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/evacuation.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:3001,http://localhost:5173}
    volumes:
      # Persist only data (SQLite + uploaded floor plans) — mounting the
      # whole /app would shadow freshly built code with the old volume copy.
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    expose:
      - "8000"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Browser → nginx → backend, so the bundled URL is a same-origin /api.
        REACT_APP_API_URL: /api
    container_name: evacuation-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  user-app:
    build:
      context: ./user-app
      args:
        # Same pattern as the admin frontend: nginx proxies /api → backend.
        VITE_API_URL: /api
    container_name: evacuation-user-app
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  backend-data:
  backend-uploads:
