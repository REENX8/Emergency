services:
  backend:
    build: ./backend
    container_name: evacuation-backend
    restart: unless-stopped
    environment:
      # Leave DATABASE_URL unset to use the bundled SQLite file inside the
      # container; set it to a Supabase / Postgres URL for production-like
      # behaviour. The CRA dev server isn't talking to this container.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:3001,http://localhost:5173}
    volumes:
      # Persist the SQLite file + uploaded floor plans across restarts.
      - backend-data:/app
    expose:
      - "8000"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Browser → nginx → backend, so the bundled URL is a same-origin /api.
        REACT_APP_API_URL: /api
    container_name: evacuation-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  user-app:
    build:
      context: ./user-app
      args:
        # Same pattern as the admin frontend: nginx proxies /api → backend.
        VITE_API_URL: /api
    container_name: evacuation-user-app
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  backend-data:
