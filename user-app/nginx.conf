server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy: anything under /api/* goes to the backend container.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Floor-plan images are served by the backend's StaticFiles mount at /uploads
    # (when not using Supabase storage). Proxy them on the same origin so the
    # browser doesn't need CORS for image loads.
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback — every unknown route serves index.html so react-router
    # can render the correct page client-side (incl. deep links like /b/12).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
