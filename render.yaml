services:
  # ─── Backend API ────────────────────────────────────────────────────
  - type: web
    name: evac-ops-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production   # makes the app refuse to start without JWT_SECRET
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://evac-ops-console.onrender.com,https://evac-ops-user.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: evac-ops-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

  # ─── Operator Console (frontend/) ───────────────────────────────────
  - type: web
    name: evac-ops-console
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /api/*
        destination: https://evac-ops-backend.onrender.com/:splat
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: /api

  # ─── Mobile Evacuee App (user-app/) ─────────────────────────────────
  - type: web
    name: evac-ops-user
    runtime: static
    rootDir: user-app
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://evac-ops-backend.onrender.com/:splat
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: /api

databases:
  - name: evac-ops-db
    databaseName: evacops
    user: evacops
    plan: free
