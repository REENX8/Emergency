services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────
  - type: web
    name: evacuation-backend
    env: python
    region: singapore        # ใกล้ไทยที่สุด
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── Frontend (React static site) ──────────────────────────────────
  - type: web
    name: evacuation-frontend
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # หลัง deploy backend แล้ว → copy URL มาใส่ตรงนี้
      # เช่น https://evacuation-backend.onrender.com
      - key: REACT_APP_API_URL
        sync: false
