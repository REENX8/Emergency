server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy: anything under /api/* goes to the backend container
    # (use the service name from docker-compose). Strips the /api prefix.
    # Upgrade/Connection headers let WebSocket connections (/api/buildings/
    # {id}/ws realtime stream) pass through; $http_upgrade is empty for
    # plain HTTP requests so they proxy normally.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — every unknown route serves index.html so react-router
    # can render the correct page client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
