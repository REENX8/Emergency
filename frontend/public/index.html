<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />

    <title>EVAC·OPS — Building Evacuation Simulation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-0: #07090d; --bg-1: #0c1118; --bg-2: #121822; --bg-3: #1a2230; --bg-4: #222d3e;
        --line-1: #1c2533; --line-2: #2a3645; --line-3: #3a4859;

        --accent-violet: oklch(0.72 0.14 295); --accent-rose: oklch(0.72 0.16 10);
        --r-sm: 4px; --r-md: 6px; --r-lg: 10px;
        --font-sans: "IBM Plex Sans Thai", "IBM Plex Sans", -apple-system, sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
