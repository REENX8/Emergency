[tool.ruff]
src = ["backend"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ANN"]
ignore = [
    "ANN101", "ANN102", "ANN401",
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"backend/test_*.py" = ["ANN", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["backend"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/test_*.py", "backend/seed_demo.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
