[tool.ruff]
src = ["backend"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module import not at top — load_dotenv() precedes app imports
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts calls in parameter defaults.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form",
    "fastapi.Body", "fastapi.Header", "fastapi.Path",
    "auth.require_role",   # role-dependency factory used inside Depends(...)
]

[tool.ruff.lint.per-file-ignores]
"backend/test_*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
# Most deps (jose, passlib, slowapi, networkx) ship no stubs, so their
# returns are Any — warning on every such return is pure noise here.
warn_return_any = false
warn_unused_ignores = true
# Alembic migrations use its runtime-proxy `op`/`context` attributes that
# mypy cannot see; the standard practice is to exclude them.
exclude = "(^|/)alembic/"

[tool.pytest.ini_options]
testpaths = ["backend"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/test_*.py", "backend/seed_demo.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
